name: Donkey Kong 64 (North America) - ovl05
sha1: 7808bf0d630e6295ac171defda6c25ce1d6f0f18
options:
  basename: ovl05
  target_path: bin/segments/ovl05.bin
  elf_path: build/ovl05.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm/ovl05
  src_path: src/ovl05
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/ovl05.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.us.txt
    - symbol_addrs.ovl05.us.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.ovl05.txt
  undefined_syms_auto_path: build/undefined_syms_auto.ovl05.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: False
  gfx_ucode: f3dex2
  asm_nonmatching_label_macro: ""

segments:
  - name: ovl05
    type: code
    start: 0x0
    vram: 0x80024000
    bss_size: 0x10
    subsegments:
      - [0x0, asm]
      - [0xBB10, data]
      - { start: 0xC160, type: bss, vram: 0x80030160 }

  - [0xC160]

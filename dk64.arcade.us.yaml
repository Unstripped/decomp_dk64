name: Donkey Kong 64 (North America) - arcade (ovl08)
sha1: 7b7e767f1fdbb6fc78473c0aea5f32a5488ae262
options:
  basename: arcade
  target_path: bin/segments/ovl08.bin
  elf_path: build/arcade.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm/arcade
  src_path: src/arcade
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/arcade.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.us.txt
    - symbol_addrs.arcade.us.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.arcade.txt
  undefined_syms_auto_path: build/undefined_syms_auto.arcade.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: False
  gfx_ucode: f3dex2
  asm_nonmatching_label_macro: ""

segments:
  - name: arcade
    type: code
    start: 0x0
    vram: 0x80024000
    bss_size: 0x1B50
    subsegments:
      - [0x0, asm]
      - [0xE220, data]
      - [0x26840, rodata]
      - { start: 0x26C00, type: bss, vram: 0x8004AC00 }

  - [0x26C00]

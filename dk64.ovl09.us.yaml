name: Donkey Kong 64 (North America) - ovl09
sha1: 31c95cadab550480c47ae0e50d58401e6fdca1a3
options:
  basename: ovl09
  target_path: bin/segments/ovl09.bin
  elf_path: build/ovl09.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm/ovl09
  src_path: src/ovl09
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/ovl09.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False

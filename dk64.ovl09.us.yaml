  undefined_funcs_auto_path: build/undefined_funcs_auto.ovl09.txt
  undefined_syms_auto_path: build/undefined_syms_auto.ovl09.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: False
  gfx_ucode: f3dex2
  asm_nonmatching_label_macro: ""

segments:
  - name: ovl09
    type: code
    start: 0x0
    vram: 0x80024000
    bss_size: 0x16FD0
    subsegments:
      - [0x0, asm]
      - [0x7090, data]

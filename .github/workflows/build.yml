# Set up the ROM secret for CI:
#   1. Create an environment named 'baserom' (Settings -> Environments).
#   2. Restrict Deployment branches to the repository default branch only.
#   3. GitHub Actions secrets are capped at 48 KB (DK64 ROM is 32 MiB), so host
#      the ROM at a private download URL (e.g. presigned S3/R2 link).
#   4. Set the secret in the 'baserom' environment:
#        gh secret set BASEROM_URL --env baserom
#
#   Security:
#   Environment branch protection rules are enforced server-side by GitHub before
#   the job runs. This prevents pull requests and pushes to non-default branches from
#   accessing BASEROM_URL, even if a branch or PR modifies this workflow file.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: dk64-decomp
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rom:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: baserom
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load Docker image from cache
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: dk64-decomp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check for baserom secret
        id: check-secret
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: |
          if [ -n "$BASEROM_URL" ]; then
            echo "::add-mask::$BASEROM_URL"
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BASEROM_URL secret is not set. Skipping ROM build and hash verification."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download baserom
        if: steps.check-secret.outputs.has_secret == 'true'
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: |
          curl -fsSL "$BASEROM_URL" -o donkey-kong.n64

      - name: Extract and split ROM
        if: steps.check-secret.outputs.has_secret == 'true'
        run: tools/dk make setup

      - name: Build and verify ROM
        if: steps.check-secret.outputs.has_secret == 'true'
        run: tools/dk make

      - name: Clean up baserom
        if: always()
        run: rm -f donkey-kong.n64

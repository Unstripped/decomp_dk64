name: Donkey Kong 64 (North America) - jetpac (ovl09)
sha1: 31c95cadab550480c47ae0e50d58401e6fdca1a3
options:
  basename: jetpac
  target_path: bin/segments/ovl09.bin
  elf_path: build/jetpac.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm/jetpac
  src_path: src/jetpac
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/jetpac.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.us.txt
    - symbol_addrs.jetpac.us.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.jetpac.txt
  undefined_syms_auto_path: build/undefined_syms_auto.jetpac.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: True
  gfx_ucode: f3dex2
  asm_nonmatching_label_macro: ""

segments:
  - name: jetpac
    type: code
    start: 0x0
    vram: 0x80024000
    bss_size: 0x16FD0
    subsegments:
      - [0x0, c, 0]
      - [0x1460, c, 1460]
      - [0x1A60, c, 1A60] # hidden TU: 1460's rodata ends with an 8-byte pad after 0.97 (0xAB28); grid bss D_8002F3D0/D_80042BD0/D_80045BD0 used only before 0x1A60
      - [0x3060, c, 3060]
      - [0x3480, c, 3480]
      - [0x4FC0, c, 4FC0]
      - [0x6E00, c, 6E00] # hidden TU (text colours, jetpacDrawString): .data/.bss 16-align pads after 4FC0's last objects (jetpacActorClearTemplate ends 0x8002E9B4; jetpacTiledSpriteCount's 0x10 bss slot ends 0x80045BE0)
      - [0x7090, .data, 0] # explosion pixels/sprites (1A60's D_8002B9C0), sound table D_8002BA50, jetpacBlinkPhase, jetpacInitPending (0x8002B090-0x8002BA80)
      - [0x7A80, .data, 1A60] # player pixels/sprites, D_8002C518 jetman template (0x8002BA80-0x8002C570)
      - [0x8570, .data, 3480] # rocket/item pixels/sprites, D_8002DC68 item x table, item templates, flame colour, ledge sprites (0x8002C570-0x8002DEB0)
      - [0x9EB0, .data, 4FC0] # enemy pixels/sprites, jetpacSpawnTimer, jetpacActorInitTable, actor templates (0x8002DEB0-0x8002E9C0)
      - [0xA9C0, .data, 6E00] # D_8002E9C0..D_8002E9CC highlight colour (0x8002E9C0-0x8002E9D0)
      - [0xA9D0, .rodata, 0]
      - [0xAB20, .rodata, 1460]
      - [0xAB30, .rodata, 1A60]
      - [0xAB70, .rodata, 3060]
      - [0xAB80, .rodata, 3480]
      - [0xABB0, .rodata, 4FC0]
      - { start: 0xAC30, type: bss, vram: 0x8002EC30 }
      - { start: 0xAC30, type: .bss, vram: 0x80045BE0, name: 6E00 } # D_80045BE0..D_80045BE3 text colour (0x80045BE0-0x80045BF0)
      - { start: 0xAC30, type: bss, vram: 0x80045BF0, name: AC30_80045BF0 }

  - [0xAC30]

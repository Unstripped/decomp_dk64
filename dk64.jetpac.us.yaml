name: Donkey Kong 64 (North America) - jetpac (ovl09)
sha1: 31c95cadab550480c47ae0e50d58401e6fdca1a3
options:
  basename: jetpac
  target_path: bin/segments/ovl09.bin
  elf_path: build/jetpac.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm/jetpac
  src_path: src/jetpac
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/jetpac.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.us.txt
    - symbol_addrs.jetpac.us.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.jetpac.txt
  undefined_syms_auto_path: build/undefined_syms_auto.jetpac.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: True
  gfx_ucode: f3dex2
  asm_nonmatching_label_macro: ""

segments:
  - name: jetpac
    type: code
    start: 0x0
    vram: 0x80024000
    bss_size: 0x16FD0
    subalign: 8 # interior data carve at 0x9CE8, not a new TU boundary
    subsegments:
      - [0x0, c, 0]
      - [0x1460, c, 1460]
      - [0x1A60, c, 1A60] # hidden TU: 1460's rodata ends with an 8-byte pad after 0.97 (0xAB28); grid bss D_8002F3D0/D_80042BD0/D_80045BD0 used only before 0x1A60
      - [0x3060, c, 3060]
      - [0x3480, c, 3480]
      - [0x4FC0, c, 4FC0]
      - [0x7090, data, 0]
      - [0x9CE8, .data, 3480] # item color + bonus template; same-TU callback affects as1 scheduling
      - [0x9D38, data, 9D38]
      - [0xA9D0, .rodata, 0]
      - [0xAB20, .rodata, 1460]
      - [0xAB30, .rodata, 1A60]
      - [0xAB70, .rodata, 3060]
      - [0xAB80, .rodata, 3480]
      - [0xABB0, .rodata, 4FC0]
      - { start: 0xAC30, type: bss, vram: 0x8002EC30 }

  - [0xAC30]

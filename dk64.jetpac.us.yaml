name: Donkey Kong 64 (North America) - jetpac (ovl09)
sha1: 31c95cadab550480c47ae0e50d58401e6fdca1a3
options:
  basename: jetpac
  target_path: bin/segments/ovl09.bin
  elf_path: build/jetpac.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm/jetpac
  src_path: src/jetpac
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/jetpac.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.us.txt
    - symbol_addrs.jetpac.us.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.jetpac.txt
  undefined_syms_auto_path: build/undefined_syms_auto.jetpac.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: False
  gfx_ucode: f3dex2
  asm_nonmatching_label_macro: ""

segments:
  - name: jetpac
    type: code
    start: 0x0
    vram: 0x80024000
    bss_size: 0x16FD0
    subsegments:
      - [0x0, asm]
      - [0x1460, asm]
      - [0x3060, asm]
      - [0x3480, asm]
      - [0x4FC0, asm]
      - [0x7090, data]
      - [0xA9D0, rodata]
      - { start: 0xAC30, type: bss, vram: 0x8002EC30 }

  - [0xAC30]

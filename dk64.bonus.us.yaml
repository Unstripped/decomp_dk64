name: Donkey Kong 64 (North America) - bonus (ovl04)
sha1: 7020f7b450a06830df0c5324f62207158a472546
options:
  basename: bonus
  target_path: bin/segments/ovl04.bin
  elf_path: build/bonus.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm/bonus
  src_path: src/bonus
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/bonus.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.us.txt
    - symbol_addrs.bonus.us.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.bonus.txt
  undefined_syms_auto_path: build/undefined_syms_auto.bonus.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: False
  gfx_ucode: f3dex2
  asm_nonmatching_label_macro: ""

segments:
  - name: bonus
    type: code
    start: 0x0
    vram: 0x80024000
    bss_size: 0x20
    subsegments:
      - [0x0, asm]
      - [0x9860, data]
      - { start: 0x9EF0, type: bss, vram: 0x8002DEF0 }

  - [0x9EF0]

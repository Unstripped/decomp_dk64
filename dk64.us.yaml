name: Donkey Kong 64 (North America)
sha1: cf806ff2603640a748fca5026ded28802f1f4a50
options:
  basename: dk64
  target_path: baserom.us.z64
  elf_path: build/dk64.us.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm
  src_path: src
  build_path: build
  create_asm_dependencies: True

  ld_script_path: build/dk64.us.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.us.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.us.txt
  undefined_syms_auto_path: build/undefined_syms_auto.us.txt

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  hardware_regs: True
  gfx_ucode: f3dex2
  # asm-processor can't size the `nonmatching` macro's lines; keep end labels so .ent/.end pair up.
  asm_nonmatching_label_macro: ""

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  # Entry stub: clears boot bss, sets $sp, jumps to 0x800009D0.
  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]

  # Segment table entry 0. Text ends at 0x8000DCB0; bss 0x80010720-0x80016630.
  - name: boot
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    bss_size: 0x5F10
    subsegments:
      - [0x1050, c, boot/main] # DMA helper, segment table init, boot thread (entry jumps to 0x800009D0)
      - [0x1630, asm]
      - [0x1CC0, asm]
      - [0x30E0, asm]
      - [0x3390, asm]
      - [0x3C00, asm]
      - [0x3D20, asm]
      - [0x5120, asm]
      - [0x51D0, asm]
      - [0x52C0, asm]
      - [0x5400, asm]
      - [0x5580, asm]
      - [0x55F0, asm]
      - [0x5740, asm]
      - [0x5BA0, asm]
